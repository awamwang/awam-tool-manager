name: Publish preflight

# 每次 push / PR 自动做发布前隐私与密钥体检。
# 体检脚本从 awam-code-publish skill 原样 vendored 到 .github/scripts/，
# 因为它不在仓库里时 CI runner 拿不到。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支上新的 push 取消旧的体检，节省 runner 时间
concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-check:
    name: Privacy / secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # gitleaks 全历史扫描 + git log 身份检查都需要完整历史
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gitleaks
        env:
          GL_VERSION: '8.30.1'
          GL_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          gitleaks version

      - name: Run publish preflight
        run: |
          python .github/scripts/publish_preflight.py . \
            --md preflight-report.md --json preflight-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-preflight-report
          path: |
            preflight-report.md
            preflight-report.json
          if-no-files-found: ignore
