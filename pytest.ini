[pytest]
# ARC-P3-02：真实端到端（e2e）用例会起真实子进程与真实 MCP 会话，慢且依赖
# 本机解释器，因此**默认不收集**（下面 addopts）。显式 `pytest -m e2e` 时，
# 命令行的 -m 会覆盖 addopts 里的 -m，只跑 e2e。
#
# 设计文档：docs/architecture_e2e_design_2026-10-17.md §3 运行策略。
# 发布 / CI 前必须显式跑一次：pytest -m e2e
markers =
    e2e: 真实子进程 / 真实 stdio 的端到端用例（较慢，默认不跑）

addopts = -m "not e2e"
